name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_MIN_STACK: 8388608
  # guestkit is a path dependency (Cargo.toml) that lives in its own public repo.
  GUESTKIT_REPO: zyvorai/zyvor-guestkit

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  scripts-lint:
    name: Scripts Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts + customer-readiness suite
        run: make scripts-lint

  helm-monitoring:
    name: Helm monitoring chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.1.4
      - name: Template veyron-monitoring
        run: make helm-monitoring-validate

  frontend:
    name: Console (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: frontend/dist
          retention-days: 3

  operator:
    name: Operator (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - run: go vet ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: operator
          version: latest
          args: --timeout=5m

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GUESTKIT_REPO }}
          path: guestkit
      - uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run audit
        run: cargo audit

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GUESTKIT_REPO }}
          path: guestkit
      - uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  build:
    name: Build (${{ matrix.os }})
    needs: [test]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GUESTKIT_REPO }}
          path: guestkit
      - uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: veyron-${{ matrix.os }}
          path: target/release/veyron

  integration:
    name: Integration Tests (Kind + KubeVirt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyron-ubuntu-latest
          path: ./bin
      - name: Make binary executable
        run: chmod +x ./bin/veyron

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create Kind cluster
        run: kind create cluster --name veyron-test --wait 60s

      - name: Install KubeVirt operator
        run: |
          source scripts/cluster/versions.env
          kubectl create -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-operator.yaml"
          kubectl create -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-cr.yaml"
          # Enable software emulation for CI (no nested virt)
          kubectl -n kubevirt patch kubevirt kubevirt --type=merge --patch '{"spec":{"configuration":{"developerConfiguration":{"useEmulation":true}}}}'
          kubectl -n kubevirt wait kv kubevirt --for condition=Available --timeout=300s

      - name: Run doctor check
        run: ./bin/veyron doctor

      - name: Test template listing
        run: ./bin/veyron templates

      - name: Test profile listing
        run: ./bin/veyron profiles

      - name: Test VM creation (dry-run)
        run: ./bin/veyron generate --name test-vm --template ubuntu

      - name: Test VM create, list, delete
        run: |
          ./bin/veyron create test-integration-vm --template ubuntu --no-start
          ./bin/veyron list
          ./bin/veyron delete test-integration-vm --yes

      - name: Cleanup
        if: always()
        run: kind delete cluster --name veyron-test

  docker:
    name: Docker Build
    needs: [fmt, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GUESTKIT_REPO }}
          path: guestkit
      - name: Read KubeVirt version
        id: versions
        run: |
          source scripts/cluster/versions.env
          echo "kubevirt=${KUBEVIRT_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: veyron:ci
          build-args: VIRTCTL_VERSION=${{ steps.versions.outputs.kubevirt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
