# Cilium clusters that enforce default-egress via allow-dns + allow-intra-namespace
# need an explicit policy so Veyron API/operator/NATS can reach kube-apiserver and
# other in-cluster endpoints. Applied by deploy-all-remote.sh / deploy-k8s-remote.sh
# when the CiliumNetworkPolicy CRD is present.
#
# Per-VM internet egress is managed separately by Veyron (CiliumNetworkPolicy or
# Kubernetes NetworkPolicy on kubevirt.io/vm=<vm>) via the API and dashboard.
#
# Namespace is substituted at apply time (__VEYRON_APP_NAMESPACE__ or veyron-system).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-veyron-system-egress-chart
  namespace: __VEYRON_APP_NAMESPACE__
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - veyron
          - nats
  egress:
    - toEntities:
        - all
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-veyron-system-egress-api-legacy
  namespace: __VEYRON_APP_NAMESPACE__
spec:
  endpointSelector:
    matchLabels:
      app: veyron-api
  egress:
    - toEntities:
        - all
