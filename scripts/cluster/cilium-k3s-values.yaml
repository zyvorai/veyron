# Cilium Helm values for single-node k3s / v9s clusters.
# Ensures pod traffic is SNATed to the node IP (fixes guest VM internet via virt-launcher NAT).
#
# Used by k8s/install-cluster-prereqs.sh and k8s/bootstrap/ensure-cilium-pod-egress.sh
kubeProxyReplacement: true
k8sServiceHost: 127.0.0.1
k8sServicePort: 6443
routingMode: native
ipv4NativeRoutingCIDR: 10.0.0.0/8
bpf:
  masquerade: true
enableIPv4Masquerade: true
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.0.0.0/8
operator:
  replicas: 1
hubble:
  enabled: false
