[package]
name = "vmrogue"
version = "0.2.0"
edition = "2024"
description = "Rogue VM management for KubeVirt with Rust power"
license = "LicenseRef-Zyvor-Proprietary"
authors = ["ZyvorAI Labs Private Limited"]
repository = "https://github.com/ssahani/VMRogue"
homepage = "https://github.com/ssahani/VMRogue"
documentation = "https://docs.rs/vmrogue"
readme = "README.md"
keywords = ["kubevirt", "kubernetes", "virtual-machine", "kvm", "cli"]
categories = ["command-line-utilities", "virtualization"]
rust-version = "1.85"

[[bin]]
name = "vmrogue"
path = "src/main.rs"

[lib]
name = "vmrogue"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "process"] }
kube = { version = "0.95", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["v1_30"] }
schemars = "0.8"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
regex = "1.10"
chrono = "0.4"
cron = "0.15"
dialoguer = "0.11"
indicatif = "0.17"
rand = "0.8"
zeroize = "1.8"
base64 = "0.22"
http = "1.1"

# TUI dependencies
ratatui = "0.28"
crossterm = "0.28"
colored = "3.1"
miette = { version = "7.0", features = ["fancy"] }
toml = "0.8"
dirs = "5.0"
rustyline = "17.0"

# Web dashboard dependencies
axum = { version = "0.7", features = ["ws"], optional = true }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
tower-http = { version = "0.6", features = ["cors", "timeout"], optional = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"], optional = true }
futures-util = { version = "0.3", optional = true }
rustls-pemfile = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"], optional = true }
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"], optional = true }
rust-embed = { version = "8.9", optional = true }

[features]
default = ["web"]
web = [
    "axum",
    "axum-server",
    "rustls",
    "tower-http",
    "tokio-tungstenite",
    "futures-util",
    "rustls-pemfile",
    "reqwest",
    "jsonwebtoken",
    "rust-embed",
]
experimental = []

[dev-dependencies]
tempfile = "3.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }

[[test]]
name = "dashboard_next_e2e"
path = "tests/dashboard_next_e2e.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
