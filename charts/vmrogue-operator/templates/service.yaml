apiVersion: v1
kind: Service
metadata:
  name: {{ include "vmrogue-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmrogue-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vmrogue-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
    - name: health
      port: {{ .Values.service.healthPort }}
      targetPort: health
      protocol: TCP
