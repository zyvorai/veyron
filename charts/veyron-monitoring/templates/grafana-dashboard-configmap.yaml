{{- if and .Values.kps.enabled .Values.veyron.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-veyron-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veyron-monitoring.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  veyron-overview.json: |-
{{ .Files.Get "files/veyron-overview.json" | nindent 4 }}
{{- end }}
