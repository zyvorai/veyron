apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "veyron-operator.fullname" . }}
  labels:
    {{- include "veyron-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["veyron.io"]
    resources: ["veyronvms", "veyronblueprints", "veyronpolicies", "veyroninsights", "veyronactions", "vmtemplates", "vmprofiles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["veyron.io"]
    resources: ["veyronvms/status", "veyronblueprints/status", "veyronpolicies/status", "veyroninsights/status", "veyronactions/status", "vmtemplates/status", "vmprofiles/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["veyron.io"]
    resources: ["veyronvms/finalizers", "veyronblueprints/finalizers"]
    verbs: ["update"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstancemigrations"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - "virtualmachineinstances/vnc"
      - "virtualmachineinstances/console"
      - "virtualmachines/start"
      - "virtualmachines/stop"
      - "virtualmachines/restart"
      - "virtualmachines/migrate"
    verbs: ["get", "update"]
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots", "virtualmachinerestores"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Write verbs required for golden-image cloning (dataVolumeTemplates ->
  # datavolumes/source). Keep in sync with operator/config/rbac/role.yaml.
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["upload.cdi.kubevirt.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["instancetype.kubevirt.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Config-drive userdata Secrets (aligned with operator/config/rbac/role.yaml)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "veyron-operator.fullname" . }}
  labels:
    {{- include "veyron-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "veyron-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "veyron-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
