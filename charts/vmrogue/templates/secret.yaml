apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vmrogue.fullname" . }}-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmrogue.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.apiKey }}
  api-key: {{ .Values.auth.apiKey | b64enc | quote }}
  {{- else }}
  api-key: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
