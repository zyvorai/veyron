{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vmrogue.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmrogue.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vmrogue.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow API traffic on service port
    - ports:
        - port: {{ .Values.api.port }}
          protocol: TCP
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow Kubernetes API server (port 443 and 6443)
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
{{- end }}
