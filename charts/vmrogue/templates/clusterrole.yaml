{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "veyron.fullname" . }}
  labels:
    {{- include "veyron.labels" . | nindent 4 }}
rules:
  # KubeVirt VMs and VMIs
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstancemigrations"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # KubeVirt subresources (VNC/console, lifecycle, virtctl-style)
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - "virtualmachineinstances/vnc"
      - "virtualmachineinstances/console"
      - "virtualmachines/start"
      - "virtualmachines/stop"
      - "virtualmachines/restart"
      - "virtualmachines/migrate"
    verbs: ["get", "update", "patch"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/pause", "virtualmachineinstances/unpause"]
    verbs: ["update", "patch"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - "virtualmachineinstances/guest-exec"
    verbs: ["get", "create", "update"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - "virtualmachineinstances/guest-exec-status"
    verbs: ["get"]
  # Snapshots
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots", "virtualmachinesnapshotcontents", "virtualmachinerestores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Veyron CRDs
  - apiGroups: ["veyron.io"]
    resources: ["veyronvms", "veyronblueprints", "veyronpolicies", "veyroninsights", "veyronactions", "vmtemplates", "vmprofiles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["veyron.io"]
    resources: ["veyronvms/status", "veyronblueprints/status", "veyronpolicies/status", "veyroninsights/status", "veyronactions/status", "vmtemplates/status", "vmprofiles/status"]
    verbs: ["get", "update", "patch"]
  # Core K8s resources
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "pods/log", "events", "persistentvolumeclaims", "configmaps", "resourcequotas"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach", "pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "configmaps"]
    verbs: ["create", "update", "patch", "delete"]
  # Leader election for the snapshot schedule worker (in-process Lease)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Storage (classes, CSI capacity, attachments)
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csistoragecapacities", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CDI + upload
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["upload.cdi.kubevirt.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # KubeVirt instance types / preferences
  - apiGroups: ["instancetype.kubevirt.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Multus
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Gateway API
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Chaos Mesh / Litmus
  - apiGroups: ["chaos-mesh.org", "litmuschaos.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Cilium
  - apiGroups: ["cilium.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # RBAC (read-only for visualization)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  # Apps (for workload and operator discovery)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  # Autoscaling
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CRD discovery
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # KubeVirt cluster MigrationPolicy CRs
  - apiGroups: ["migrations.kubevirt.io"]
    resources: ["migrationpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Metrics Server (PodMetrics / Node metrics)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
{{- end }}
