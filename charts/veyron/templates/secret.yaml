apiVersion: v1
kind: Secret
metadata:
  name: {{ include "veyron.apiKeySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veyron.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (include "veyron.apiKeySecretName" .)) -}}
  {{- /* Lab default admin / Admin@321 (same as Netra) unless auth.apiKey / auth.adminPassword
         are set; an existing Secret is preserved across upgrades. Override for production. */}}
  {{- $apiKey := "" }}
  {{- if .Values.auth.apiKey }}
  {{- $apiKey = .Values.auth.apiKey | b64enc }}
  {{- else if and $existingSecret (index $existingSecret.data "api-key") }}
  {{- $apiKey = index $existingSecret.data "api-key" }}
  {{- else }}
  {{- $apiKey = "Admin@321" | b64enc }}
  {{- end }}
  api-key: {{ $apiKey | quote }}
  {{- if .Values.auth.jwtSecret }}
  jwt-secret: {{ .Values.auth.jwtSecret | b64enc | quote }}
  {{- else }}
  jwt-secret: {{ if $existingSecret }}{{ index $existingSecret.data "jwt-secret" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{- end }}
  jwt-issuer: {{ .Values.auth.jwtIssuer | default "veyron" | b64enc | quote }}
  {{- if .Values.auth.adminPassword }}
  admin-password: {{ .Values.auth.adminPassword | b64enc | quote }}
  {{- else if and $existingSecret (index $existingSecret.data "admin-password") }}
  admin-password: {{ index $existingSecret.data "admin-password" | quote }}
  {{- else }}
  admin-password: {{ "Admin@321" | b64enc | quote }}
  {{- end }}
