apiVersion: v1
kind: Secret
metadata:
  name: {{ include "veyron.apiKeySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veyron.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (include "veyron.apiKeySecretName" .)) -}}
  {{- if .Values.auth.apiKey }}
  api-key: {{ .Values.auth.apiKey | b64enc | quote }}
  {{- else }}
  api-key: {{ "CHANGE_ME" | b64enc | quote }}
  {{- end }}
  {{- /* A hardcoded jwt-secret default would let anyone who has read this file forge a
         valid token for any deployment that didn't override it — a full auth bypass, not
         just a guessable login password. Auto-generate (and preserve across upgrades via
         the existing-secret lookup) instead, same pattern as api-key/admin-password relying
         on a fixed fallback being acceptable (a login credential, not a signing key). */}}
  {{- if .Values.auth.jwtSecret }}
  jwt-secret: {{ .Values.auth.jwtSecret | b64enc | quote }}
  {{- else }}
  jwt-secret: {{ if $existingSecret }}{{ index $existingSecret.data "jwt-secret" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{- end }}
  jwt-issuer: {{ .Values.auth.jwtIssuer | default "veyron" | b64enc | quote }}
  admin-password: {{ .Values.auth.adminPassword | default (.Values.auth.apiKey | default "CHANGE_ME") | b64enc | quote }}
