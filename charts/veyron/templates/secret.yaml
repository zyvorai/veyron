apiVersion: v1
kind: Secret
metadata:
  name: {{ include "veyron.apiKeySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veyron.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.apiKey }}
  api-key: {{ .Values.auth.apiKey | b64enc | quote }}
  {{- else }}
  api-key: {{ "Admin@321" | b64enc | quote }}
  {{- end }}
  jwt-secret: {{ .Values.auth.jwtSecret | default "veyron-dev-jwt-secret-change-me" | b64enc | quote }}
  jwt-issuer: {{ .Values.auth.jwtIssuer | default "veyron" | b64enc | quote }}
  admin-password: {{ .Values.auth.adminPassword | default (.Values.auth.apiKey | default "Admin@321") | b64enc | quote }}
