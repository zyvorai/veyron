apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "veyron.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veyron.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "veyron.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "veyron.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "veyron.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.tls.enabled .Values.tls.autoGenerate (not .Values.tls.existingSecret) }}
      initContainers:
        - name: tls-init
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              apk add --no-cache openssl
              openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
                -keyout /tls/tls.key -out /tls/tls.crt -days 365 -nodes \
                -subj "/CN={{ include "veyron.fullname" . }}.{{ .Release.Namespace }}.svc"
              chown 10001:10001 /tls/tls.key /tls/tls.crt
          volumeMounts:
            - name: tls-certs
              mountPath: /tls
      {{- end }}
      containers:
        - name: veyron
          image: "{{ .Values.image.repository }}:{{ include "veyron.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - api-serve
            - --port
            - "{{ .Values.api.port }}"
            - --host
            - "{{ .Values.api.host }}"
            {{- if .Values.tls.enabled }}
            - --tls
            - --tls-cert
            - /tls/tls.crt
            - --tls-key
            - /tls/tls.key
            {{- end }}
            - --rate-limit
            - "{{ .Values.rateLimit.perMinute }}"
          env:
            - name: VEYRON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "veyron.apiKeySecretName" . }}
                  key: api-key
            - name: VEYRON_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "veyron.apiKeySecretName" . }}
                  key: jwt-secret
            - name: VEYRON_JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ include "veyron.apiKeySecretName" . }}
                  key: jwt-issuer
            - name: VEYRON_BOOTSTRAP_ADMIN_USER
              value: {{ .Values.auth.adminUser | default "admin" | quote }}
            - name: VEYRON_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "veyron.apiKeySecretName" . }}
                  key: admin-password
            - name: VEYRON_BOOTSTRAP_ADMIN_SYNC
              value: {{ .Values.auth.bootstrapAdminSync | default "1" | quote }}
            {{- if .Values.auth.additionalKeys }}
            - name: VEYRON_API_KEYS
              value: {{ .Values.auth.additionalKeys | quote }}
            {{- end }}
            - name: VEYRON_NAMESPACE
              value: {{ .Values.api.namespace | quote }}
            - name: RUST_LOG
              value: "info"
            - name: VEYRON_API_NODE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: VEYRON_API_NODE_PORT
              value: "30151"
            - name: VEYRON_CLUSTER_DNS
              value: "10.43.0.10"
            {{- with .Values.integrations.prometheusUrl }}
            - name: VEYRON_PROMETHEUS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.integrations.opencostUrl }}
            - name: VEYRON_OPENCOST_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.integrations.opencostToken }}
            - name: VEYRON_OPENCOST_TOKEN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.integrations.trivyUrl }}
            - name: VEYRON_TRIVY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.integrations.lokiUrl }}
            - name: VEYRON_LOKI_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.integrations.jaegerQueryUrl }}
            - name: VEYRON_JAEGER_QUERY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.integrations.tempoQueryUrl }}
            - name: VEYRON_TEMPO_QUERY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.integrations.alertmanagerUrl }}
            - name: VEYRON_ALERTMANAGER_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.integrations.argocdUrl }}
            - name: VEYRON_ARGOCD_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.integrations.argocdToken }}
            - name: VEYRON_ARGOCD_TOKEN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.integrations.packetwolfUrl }}
            - name: VEYRON_PACKETWOLF_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.integrations.packetwolfExternalUrl }}
            - name: VEYRON_PACKETWOLF_EXTERNAL_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.integrations.packetwolfApiKey }}
            - name: VEYRON_PACKETWOLF_API_KEY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.ai.url }}
            - name: VEYRON_AI_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.ai.apiKey }}
            - name: VEYRON_AI_API_KEY
              value: {{ .Values.ai.apiKey | quote }}
            {{- end }}
            {{- with .Values.ai.model }}
            - name: VEYRON_AI_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.ai.mode }}
            - name: VEYRON_AI_MODE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.ai.maxToolRounds }}
            - name: VEYRON_AI_MAX_TOOL_ROUNDS
              value: {{ .Values.ai.maxToolRounds | quote }}
            {{- end }}
            {{- if .Values.ai.timeoutSecs }}
            - name: VEYRON_AI_TIMEOUT_SECS
              value: {{ .Values.ai.timeoutSecs | quote }}
            {{- end }}
            {{- if .Values.ai.rateLimitPerMin }}
            - name: VEYRON_AI_RATE_LIMIT_PER_MIN
              value: {{ .Values.ai.rateLimitPerMin | quote }}
            {{- end }}
            {{- if not .Values.oidc.existingSecret }}
            {{- with .Values.oidc.issuer }}
            - name: VEYRON_OIDC_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.clientId }}
            - name: VEYRON_OIDC_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.clientSecret }}
            - name: VEYRON_OIDC_CLIENT_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.authorizationUrl }}
            - name: VEYRON_OIDC_AUTHORIZATION_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.tokenUrl }}
            - name: VEYRON_OIDC_TOKEN_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.jwksUrl }}
            - name: VEYRON_OIDC_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.redirectUri }}
            - name: VEYRON_OIDC_REDIRECT_URI
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.roleClaim }}
            - name: VEYRON_OIDC_ROLE_CLAIM
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.groupAdmin }}
            - name: VEYRON_OIDC_GROUP_ADMIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.groupWrite }}
            - name: VEYRON_OIDC_GROUP_WRITE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          {{- if or .Values.integrations.existingSecret .Values.oidc.existingSecret }}
          envFrom:
          {{- if .Values.integrations.existingSecret }}
            - secretRef:
                name: {{ .Values.integrations.existingSecret }}
          {{- end }}
          {{- if .Values.oidc.existingSecret }}
            - secretRef:
                name: {{ .Values.oidc.existingSecret }}
          {{- end }}
          {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            {{- if .Values.tls.enabled }}
            - name: tls-certs
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.tls.enabled }}
        - name: tls-certs
          {{- if .Values.tls.existingSecret }}
          secret:
            secretName: {{ .Values.tls.existingSecret }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
