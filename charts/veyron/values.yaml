replicaCount: 1

# Stable resource names (Deployment/Service veyron-api; SA/ClusterRole veyron).
fullnameOverride: "veyron-api"

image:
  repository: ghcr.io/zyvorai/veyron
  tag: "latest"  # or pin to a specific version e.g. "0.3.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""

serviceAccount:
  create: true
  name: "veyron"
  annotations: {}

service:
  type: NodePort
  port: 5151
  nodePort: 30151

api:
  host: "0.0.0.0"
  port: 5151
  namespace: "default"

tls:
  enabled: true
  autoGenerate: true
  existingSecret: ""

auth:
  # Empty = lab default Admin@321 on first install (same as Netra), preserved across
  # upgrades. Set a random value for production.
  apiKey: ""
  adminUser: "admin"
  # Console login password. Empty = lab default Admin@321.
  adminPassword: ""
  # Empty = auto-generated (random, 64 chars) on first install, preserved across upgrades.
  # A hardcoded default here would be a full auth-bypass vector (anyone who reads this
  # file could forge a valid token) — unlike apiKey/adminPassword, never set a fixed
  # fallback for this.
  jwtSecret: ""
  jwtIssuer: "veyron"
  bootstrapAdminSync: "1"
  additionalKeys: ""
  secretName: "veyron-api-key"

rateLimit:
  perMinute: 60

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true

rbac:
  create: true
  # ClusterRole name (distinct from Deployment veyron-api).
  clusterRoleName: "veyron"

integrations:
  prometheusUrl: ""
  opencostUrl: ""
  opencostToken: ""
  trivyUrl: ""
  lokiUrl: ""
  jaegerQueryUrl: ""
  tempoQueryUrl: ""
  alertmanagerUrl: ""
  argocdUrl: ""
  argocdToken: ""
  # Netra: auto-detected from the netra Service in netra-system; set netraUrl only when it
  # runs elsewhere. netraApiKey defaults to Netra's lab default (Admin@321).
  netraUrl: ""
  netraExternalUrl: ""
  netraApiKey: ""
  existingSecret: ""

oidc:
  # Enterprise SSO against a real IdP (Keycloak/Auth0/Okta). See
  # contrib/veyron-oidc-keycloak.env.example for a worked Keycloak example.
  issuer: ""
  clientId: ""
  clientSecret: ""
  authorizationUrl: ""
  tokenUrl: ""
  jwksUrl: ""
  redirectUri: ""
  roleClaim: ""
  ## Comma-separated group names -> admin role (default in code: veyron-admins,cluster-admins)
  groupAdmin: ""
  ## Comma-separated group names -> write role (default in code: veyron-write,veyron-editors)
  groupWrite: ""
  # Set to source the above from an existing Secret's keys (VEYRON_OIDC_*)
  # instead of plaintext values.yaml — e.g. the veyron-oidc Secret written by
  # `deploy-all-remote.sh --with-oidc`.
  existingSecret: ""

ai:
  url: ""
  apiKey: ""
  model: "gpt-4o-mini"
  mode: ""
  maxToolRounds: 2
  timeoutSecs: 30
  rateLimitPerMin: 20
