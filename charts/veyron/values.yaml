replicaCount: 1

# Stable resource names (Deployment/Service veyron-api; SA/ClusterRole veyron).
fullnameOverride: "veyron-api"

image:
  repository: ghcr.io/ssahani/veyron
  tag: "latest"  # or pin to a specific version e.g. "0.3.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""

serviceAccount:
  create: true
  name: "veyron"
  annotations: {}

service:
  type: NodePort
  port: 5151
  nodePort: 30151

api:
  host: "0.0.0.0"
  port: 5151
  namespace: "default"

tls:
  enabled: true
  autoGenerate: true
  existingSecret: ""

auth:
  apiKey: "Admin@321"
  adminUser: "admin"
  adminPassword: "Admin@321"
  jwtSecret: "veyron-dev-jwt-secret-change-me"
  jwtIssuer: "veyron"
  bootstrapAdminSync: "1"
  additionalKeys: ""
  secretName: "veyron-api-key"

rateLimit:
  perMinute: 60

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true

rbac:
  create: true
  # ClusterRole name (distinct from Deployment veyron-api).
  clusterRoleName: "veyron"

integrations:
  prometheusUrl: ""
  opencostUrl: ""
  opencostToken: ""
  trivyUrl: ""
  lokiUrl: ""
  jaegerQueryUrl: ""
  tempoQueryUrl: ""
  alertmanagerUrl: ""
  argocdUrl: ""
  argocdToken: ""
  packetwolfUrl: ""
  packetwolfExternalUrl: ""
  packetwolfApiKey: ""
  existingSecret: ""

ai:
  url: ""
  apiKey: ""
  model: "gpt-4o-mini"
  mode: ""
  maxToolRounds: 2
  timeoutSecs: 30
  rateLimitPerMin: 20
