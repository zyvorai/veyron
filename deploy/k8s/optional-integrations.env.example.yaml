# Optional integration URLs for Veyron API (production parity).
# Copy to optional-integrations.env.yaml, fill values, then:
#   kubectl apply -f deploy/k8s/optional-integrations.env.yaml
#   kubectl rollout restart deployment/veyron-api -n veyron-system
#
# See docs/integrations.md
---
apiVersion: v1
kind: Secret
metadata:
  name: veyron-integrations
  namespace: veyron-system
  labels:
    app.kubernetes.io/name: veyron
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # Observability
  # kube-prometheus-stack (Helm release name may differ — kubectl get svc -n monitoring)
  VEYRON_PROMETHEUS_URL: "http://kube-prometheus-kube-prome-prometheus.monitoring.svc:9090/api/v1/query"
  VEYRON_GRAFANA_URL: "http://kube-prometheus-grafana.monitoring.svc:3000"
  # Browser console URLs (NodePort on a cluster node, or public ingress)
  VEYRON_GRAFANA_EXTERNAL_URL: "http://YOUR_NODE_IP:30080"
  VEYRON_PROMETHEUS_EXTERNAL_URL: "http://YOUR_NODE_IP:30090"
  VEYRON_ALERTMANAGER_EXTERNAL_URL: "http://YOUR_NODE_IP:30093"
  VEYRON_ALERTMANAGER_URL: "http://kube-prometheus-kube-prome-alertmanager.monitoring.svc:9093"
  VEYRON_LOKI_URL: "http://loki.loki.svc:3100"
  VEYRON_JAEGER_QUERY_URL: "http://jaeger-query.observability.svc:16686/api/traces"
  # FinOps / security
  VEYRON_OPENCOST_URL: "http://opencost.opencost.svc:9003"
  # VEYRON_OPENCOST_TOKEN: ""
  VEYRON_TRIVY_URL: "http://trivy.trivy.svc:4954"
  # Ask Zeus / Copilot LLM (OpenAI-compatible — see docs/integrations.md)
  # OpenRouter (from ~/.zshrc): ./scripts/configure-zeus-openrouter.sh HOST USER
  # VEYRON_AI_URL: "https://openrouter.ai/api/v1"
  # VEYRON_AI_API_KEY: "sk-or-v1-..."
  # VEYRON_AI_MODE: "routing"
  # VEYRON_AI_MODEL: "openrouter/free"
  # VEYRON_AI_APP_TITLE: "ZeusOS"
  # Or OpenAI: VEYRON_AI_URL: "https://api.openai.com/v1" / VEYRON_AI_MODEL: "gpt-4o-mini"
  # VEYRON_AI_MAX_TOOL_ROUNDS: "2"
  # VEYRON_AI_TIMEOUT_SECS: "30"
  # VEYRON_AI_RATE_LIMIT_PER_MIN: "20"
  # Netra eBPF network observability — auto-detected from the netra Service in netra-system.
  # Set VEYRON_NETRA_URL only when Netra runs elsewhere; the API key defaults to Admin@321.
  # VEYRON_NETRA_URL: "https://netra.netra-system.svc:30870"
  # VEYRON_NETRA_EXTERNAL_URL: "https://YOUR_NODE_IP:30870"
  # VEYRON_NETRA_API_KEY: ""
  # VEYRON_NETRA_TLS_VERIFY: "1"   # verify Netra's certificate (default: accept self-signed)
  # GitOps
  # Kryton machine API (lab/edge machines, golden images). Put the token in the
  # veyron-kryton-auth Secret instead; see deploy/k8s.yaml.
  # VEYRON_KRYTON_URL: "http://kryton.kryton-system:8080"
  # VEYRON_KRYTON_PROJECT: ""
  # VEYRON_ARGOCD_URL: "https://argocd-server.argocd.svc"
  # VEYRON_ARGOCD_TOKEN: ""
  # SOC / SIEM (see docs/soc.md)
  # VEYRON_ELASTIC_URL: "https://elastic.example:9200"
  # VEYRON_ELASTIC_API_KEY: ""
  # VEYRON_ELASTIC_INDEX: "veyron-security"
  # VEYRON_ELASTIC_HUNT_ENABLED: "true"
  # VEYRON_SPLUNK_HEC_URL: "https://splunk.example:8088/services/collector/event"
  # VEYRON_SPLUNK_HEC_TOKEN: ""
  # VEYRON_SPLUNK_HUNT_ENABLED: "true"
  # VEYRON_SENTINEL_DCE_URL: ""
  # VEYRON_SENTINEL_TENANT_ID: ""
  # VEYRON_SENTINEL_CLIENT_ID: ""
  # VEYRON_SENTINEL_CLIENT_SECRET: ""
  # VEYRON_QRADAR_HOST: ""
  # VEYRON_QRADAR_PORT: "514"
  # VEYRON_SOAR_WEBHOOK_URL: ""
  # Notifications (optional)
  # VEYRON_SLACK_WEBHOOK_URL: ""
  # VEYRON_EMAIL_RELAY_URL: ""
