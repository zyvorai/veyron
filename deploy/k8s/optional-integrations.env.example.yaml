# Optional integration URLs for VMRogue API (production parity).
# Copy to optional-integrations.env.yaml, fill values, then:
#   kubectl apply -f deploy/k8s/optional-integrations.env.yaml
#   kubectl rollout restart deployment/vmrogue-api -n vmrogue-system
#
# See docs/OPTIONAL_INTEGRATIONS.md
---
apiVersion: v1
kind: Secret
metadata:
  name: vmrogue-integrations
  namespace: vmrogue-system
  labels:
    app.kubernetes.io/name: vmrogue
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # Observability
  # kube-prometheus-stack (Helm release name may differ — kubectl get svc -n monitoring)
  VMROGUE_PROMETHEUS_URL: "http://kube-prometheus-kube-prome-prometheus.monitoring.svc:9090/api/v1/query"
  VMROGUE_GRAFANA_URL: "http://kube-prometheus-grafana.monitoring.svc:3000"
  # Browser console URLs (NodePort on a cluster node, or public ingress)
  VMROGUE_GRAFANA_EXTERNAL_URL: "http://HOST:30080"
  VMROGUE_PROMETHEUS_EXTERNAL_URL: "http://HOST:30090"
  VMROGUE_ALERTMANAGER_EXTERNAL_URL: "http://HOST:30093"
  VMROGUE_ALERTMANAGER_URL: "http://kube-prometheus-kube-prome-alertmanager.monitoring.svc:9093"
  VMROGUE_LOKI_URL: "http://loki.loki.svc:3100"
  VMROGUE_JAEGER_QUERY_URL: "http://jaeger-query.observability.svc:16686/api/traces"
  # FinOps / security
  VMROGUE_OPENCOST_URL: "http://opencost.opencost.svc:9003"
  # VMROGUE_OPENCOST_TOKEN: ""
  VMROGUE_TRIVY_URL: "http://trivy.trivy.svc:4954"
  # Ask Zeus / Copilot LLM (OpenAI-compatible — see docs/VMROGUE_AI.md)
  # OpenRouter (from ~/.zshrc): ./scripts/configure-zeus-openrouter.sh HOST USER
  # VMROGUE_AI_URL: "https://openrouter.ai/api/v1"
  # VMROGUE_AI_API_KEY: "sk-or-v1-..."
  # VMROGUE_AI_MODE: "routing"
  # VMROGUE_AI_MODEL: "openrouter/free"
  # VMROGUE_AI_APP_TITLE: "ZeusOS"
  # Or OpenAI: VMROGUE_AI_URL: "https://api.openai.com/v1" / VMROGUE_AI_MODEL: "gpt-4o-mini"
  # VMROGUE_AI_MAX_TOOL_ROUNDS: "2"
  # VMROGUE_AI_TIMEOUT_SECS: "30"
  # VMROGUE_AI_RATE_LIMIT_PER_MIN: "20"
  # PacketWolf Network Brain (in-cluster trust — API key optional when trustClusterNetworks=true)
  # VMROGUE_PACKETWOLF_URL: "http://packetwolf-api.cilium-system.svc:9191"
  # VMROGUE_PACKETWOLF_EXTERNAL_URL: "http://HOST:30808"
  # VMROGUE_PACKETWOLF_API_KEY: ""
  # GitOps
  # VMROGUE_ARGOCD_URL: "https://argocd-server.argocd.svc"
  # VMROGUE_ARGOCD_TOKEN: ""
  # SOC / SIEM (see docs/SOC.md)
  # VMROGUE_ELASTIC_URL: "https://elastic.example:9200"
  # VMROGUE_ELASTIC_API_KEY: ""
  # VMROGUE_ELASTIC_INDEX: "vmrogue-security"
  # VMROGUE_ELASTIC_HUNT_ENABLED: "true"
  # VMROGUE_SPLUNK_HEC_URL: "https://splunk.example:8088/services/collector/event"
  # VMROGUE_SPLUNK_HEC_TOKEN: ""
  # VMROGUE_SPLUNK_HUNT_ENABLED: "true"
  # VMROGUE_SENTINEL_DCE_URL: ""
  # VMROGUE_SENTINEL_TENANT_ID: ""
  # VMROGUE_SENTINEL_CLIENT_ID: ""
  # VMROGUE_SENTINEL_CLIENT_SECRET: ""
  # VMROGUE_QRADAR_HOST: ""
  # VMROGUE_QRADAR_PORT: "514"
  # VMROGUE_SOAR_WEBHOOK_URL: ""
  # Notifications (optional)
  # VMROGUE_SLACK_WEBHOOK_URL: ""
  # VMROGUE_EMAIL_RELAY_URL: ""
