# VMRogue Kubernetes Deployment
#
# Prerequisites:
#   kubectl create secret generic vmrogue-api-key \
#     --namespace=vmrogue-system \
#     --from-literal=api-key=$(openssl rand -hex 32)
#
# Or use: ./scripts/deploy-k8s.sh deploy (creates the secret automatically)
---
apiVersion: v1
kind: Namespace
metadata:
  name: vmrogue-system
  labels:
    app.kubernetes.io/name: vmrogue
    app.kubernetes.io/part-of: vmrogue
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmrogue
  namespace: vmrogue-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmrogue
rules:
  # KubeVirt VMs
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances", "virtualmachineinstancemigrations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # KubeVirt subresources (VNC, console, pause, unpause, migrate)
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - "virtualmachineinstances/vnc"
      - "virtualmachineinstances/console"
      - "virtualmachineinstances/pause"
      - "virtualmachineinstances/unpause"
    verbs: ["get", "update"]
  # KubeVirt snapshots
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots", "virtualmachinesnapshotcontents", "virtualmachinerestores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Core resources
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete"]
  # Storage classes
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # VMRogue CRDs (operator integration)
  - apiGroups: ["vmrogue.io"]
    resources:
      - "vmroguevms"
      - "vmrogueblueprints"
      - "vmroguepolicies"
      - "vmrogueinsights"
      - "vmrogueactions"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["vmrogue.io"]
    resources:
      - "vmroguevms/status"
      - "vmrogueblueprints/status"
      - "vmroguepolicies/status"
      - "vmrogueinsights/status"
      - "vmrogueactions/status"
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmrogue
subjects:
  - kind: ServiceAccount
    name: vmrogue
    namespace: vmrogue-system
roleRef:
  kind: ClusterRole
  name: vmrogue
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmrogue-api
  namespace: vmrogue-system
  labels:
    app.kubernetes.io/name: vmrogue
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmrogue
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmrogue
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: vmrogue
      initContainers:
        - name: gen-cert
          image: alpine/openssl:3.3.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              openssl req -x509 -nodes -days 3650 \
                -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
                -keyout /certs/tls.key -out /certs/tls.crt \
                -subj "/CN=vmrogue/O=vmrogue" \
                -addext "subjectAltName=DNS:vmrogue-api,DNS:vmrogue-api.vmrogue-system.svc,DNS:localhost,IP:127.0.0.1"
              chown 10001:10001 /certs/tls.key /certs/tls.crt
              chmod 600 /certs/tls.key && chmod 644 /certs/tls.crt
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
      containers:
        - name: vmrogue
          image: docker.io/library/vmrogue:latest
          imagePullPolicy: Never
          args: ["api-serve", "--port", "5151", "--host", "0.0.0.0", "--tls", "--tls-cert", "/certs/tls.crt", "--tls-key", "/certs/tls.key"]
          ports:
            - containerPort: 5151
              name: https
              protocol: TCP
            - containerPort: 5150
              name: http-redirect
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          env:
            - name: VMROGUE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vmrogue-api-key
                  key: api-key
            - name: RUST_LOG
              value: "info"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: tls-certs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vmrogue-api
  namespace: vmrogue-system
  labels:
    app.kubernetes.io/name: vmrogue
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: vmrogue
    app.kubernetes.io/component: api
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
      nodePort: 30151
    - port: 80
      targetPort: http-redirect
      protocol: TCP
      name: http-redirect
      nodePort: 30150
