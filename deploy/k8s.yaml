# Veyron Kubernetes Deployment
#
# Prerequisites (created automatically by deploy-k8s.sh / deploy-all-remote.sh):
#   kubectl create secret generic veyron-api-key \
#     --namespace=veyron-system \
#     --from-literal=api-key=Admin@321 \
#     --from-literal=jwt-secret=veyron-dev-jwt-secret-change-me \
#     --from-literal=jwt-issuer=veyron \
#     --from-literal=admin-password=Admin@321
#
# Dashboard login: username admin · password Admin@321 (same as API key by default).
# Or use: ./scripts/deploy-k8s.sh deploy (creates the secret automatically)
#
# Legacy: veyron-system / veyron-api still work on existing clusters until migrated.
---
apiVersion: v1
kind: Namespace
metadata:
  name: veyron-system
  labels:
    app.kubernetes.io/name: veyron
    app.kubernetes.io/part-of: veyron
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: veyron
  namespace: veyron-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: veyron
rules:
  # KubeVirt VMs and VMIs
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstancemigrations"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # KubeVirt operator CR — read version + trigger imageTag upgrade
  - apiGroups: ["kubevirt.io"]
    resources: ["kubevirts"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # KubeVirt subresources (VNC/console, lifecycle, align with operator virtctl-style APIs)
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - "virtualmachineinstances/vnc"
      - "virtualmachineinstances/console"
      - "virtualmachines/start"
      - "virtualmachines/stop"
      - "virtualmachines/restart"
      - "virtualmachines/migrate"
    verbs: ["get", "update", "patch"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/pause", "virtualmachineinstances/unpause"]
    verbs: ["update", "patch"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - "virtualmachineinstances/guest-exec"
    verbs: ["get", "create", "update"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - "virtualmachineinstances/guest-exec-status"
    verbs: ["get"]
  # Volume hotplug/hotremove (virtctl addvolume/removevolume act on the VMI,
  # not the VM, even though the CLI takes the VM name) — reproduced live:
  # "cannot update resource virtualmachineinstances/addvolume" without this.
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - "virtualmachineinstances/addvolume"
      - "virtualmachineinstances/removevolume"
    verbs: ["update"]
  # Snapshots
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots", "virtualmachinesnapshotcontents", "virtualmachinerestores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Veyron CRDs (veyron.io — unchanged)
  - apiGroups: ["veyron.io"]
    resources: ["veyronvms", "veyronblueprints", "veyronpolicies", "veyroninsights", "veyronactions", "vmtemplates", "vmprofiles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["veyron.io"]
    resources:
      - "veyronvms/status"
      - "veyronblueprints/status"
      - "veyronpolicies/status"
      - "veyroninsights/status"
      - "veyronactions/status"
      - "vmtemplates/status"
      - "vmprofiles/status"
    verbs: ["get", "update", "patch"]
  # Core Kubernetes
  - apiGroups: [""]
    resources:
      - "namespaces"
      - "nodes"
      - "pods"
      - "pods/log"
      - "events"
      - "persistentvolumeclaims"
      - "configmaps"
      - "resourcequotas"
    verbs: ["get", "list", "watch"]
  # Node maintenance — cordon/uncordon (patch spec.unschedulable)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach", "pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "configmaps"]
    verbs: ["create", "update", "patch", "delete"]
  # Leader election (snapshot scheduler Lease)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Storage (classes, CSI capacity, CSI volume snapshots)
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csistoragecapacities", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Velero — list status + trigger backups/restores
  - apiGroups: ["velero.io"]
    resources: ["backups", "restores"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["velero.io"]
    resources: ["backupstoragelocations", "schedules", "volumesnapshotlocations"]
    verbs: ["get", "list", "watch"]
  # CDI (DataVolume / import / upload — full verbs for GitOps-style API use)
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["upload.cdi.kubevirt.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # KubeVirt instance types / preferences (VM specs may reference these)
  - apiGroups: ["instancetype.kubevirt.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Multus / NADs
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Gateway API (optional ingress next-gen)
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Chaos Mesh / Litmus (custom-resources + chaos handlers list arbitrary CRs in these groups)
  - apiGroups: ["chaos-mesh.org", "litmuschaos.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Cilium (optional — read + manage policies from API)
  - apiGroups: ["cilium.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # RBAC (read-only visualization)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  # Apps (workloads / operator discovery)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  # Autoscaling
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CRD discovery
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # KubeVirt cluster MigrationPolicy CRs (API: /api/v1/kubevirt/migration-policies)
  - apiGroups: ["migrations.kubevirt.io"]
    resources: ["migrationpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Metrics Server (VM live metrics via PodMetrics)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: veyron
subjects:
  - kind: ServiceAccount
    name: veyron
    namespace: veyron-system
roleRef:
  kind: ClusterRole
  name: veyron
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: veyron-api
  namespace: veyron-system
  labels:
    app.kubernetes.io/name: veyron
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: veyron
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veyron
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: veyron
      initContainers:
        - name: gen-cert
          image: alpine/openssl:3.3.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              openssl req -x509 -nodes -days 3650 \
                -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
                -keyout /certs/tls.key -out /certs/tls.crt \
                -subj "/CN=veyron/O=veyron" \
                -addext "subjectAltName=DNS:veyron-api,DNS:veyron-api.veyron-system.svc,DNS:localhost,IP:127.0.0.1"
              chown 10001:10001 /certs/tls.key /certs/tls.crt
              chmod 600 /certs/tls.key && chmod 644 /certs/tls.crt
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
      containers:
        - name: veyron
          image: docker.io/library/veyron:latest
          imagePullPolicy: Never
          args: ["api-serve", "--port", "5151", "--host", "0.0.0.0", "--tls", "--tls-cert", "/certs/tls.crt", "--tls-key", "/certs/tls.key"]
          ports:
            - containerPort: 5151
              hostPort: 5151
              name: https
              protocol: TCP
            - containerPort: 5150
              hostPort: 5150
              name: http-redirect
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          env:
            - name: VEYRON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: veyron-api-key
                  key: api-key
            # Username/password dashboard login (POST /api/v1/auth/login)
            - name: VEYRON_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: veyron-api-key
                  key: jwt-secret
            - name: VEYRON_JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: veyron-api-key
                  key: jwt-issuer
            - name: VEYRON_BOOTSTRAP_ADMIN_USER
              value: "admin"
            - name: VEYRON_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veyron-api-key
                  key: admin-password
            - name: VEYRON_BOOTSTRAP_ADMIN_SYNC
              value: "1"
            - name: VEYRON_NAMESPACE
              value: "veyron-system"
            - name: RUST_LOG
              value: "info"
            - name: VEYRON_API_NODE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: VEYRON_API_NODE_PORT
              value: "30151"
            - name: VEYRON_CLUSTER_DNS
              value: "10.43.0.10"
          envFrom:
            - secretRef:
                name: veyron-integrations
                optional: true
            # Enterprise SSO (Keycloak/Auth0/Okta) — absent unless the
            # veyron-oidc Secret exists (created by --with-oidc in
            # deploy-all-remote.sh). See contrib/veyron-oidc-keycloak.env.example.
            - secretRef:
                name: veyron-oidc
                optional: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: tls-certs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: veyron-api
  namespace: veyron-system
  labels:
    app.kubernetes.io/name: veyron
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: veyron
    app.kubernetes.io/component: api
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
      nodePort: 30151
    - port: 80
      targetPort: http-redirect
      protocol: TCP
      name: http-redirect
      nodePort: 30150
