# VMRogue Kubernetes Deployment
#
# Prerequisites:
#   kubectl create secret generic vmrogue-api-key \
#     --namespace=vmrogue-system \
#     --from-literal=api-key=$(openssl rand -hex 32)
#
# Or use: ./scripts/deploy-k8s.sh deploy (creates the secret automatically)
---
apiVersion: v1
kind: Namespace
metadata:
  name: vmrogue-system
  labels:
    app.kubernetes.io/name: vmrogue
    app.kubernetes.io/part-of: vmrogue
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmrogue
  namespace: vmrogue-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmrogue
rules:
  # KubeVirt VMs and VMIs
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstancemigrations"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # KubeVirt subresources (VNC/console, lifecycle, align with operator virtctl-style APIs)
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - "virtualmachineinstances/vnc"
      - "virtualmachineinstances/console"
      - "virtualmachines/start"
      - "virtualmachines/stop"
      - "virtualmachines/restart"
      - "virtualmachines/migrate"
    verbs: ["get", "update", "patch"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/pause", "virtualmachineinstances/unpause"]
    verbs: ["update", "patch"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - "virtualmachineinstances/guest-exec"
    verbs: ["get", "create", "update"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - "virtualmachineinstances/guest-exec-status"
    verbs: ["get"]
  # Snapshots
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots", "virtualmachinesnapshotcontents", "virtualmachinerestores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # VMRogue CRDs
  - apiGroups: ["vmrogue.io"]
    resources: ["vmroguevms", "vmrogueblueprints", "vmroguepolicies", "vmrogueinsights", "vmrogueactions", "vmtemplates", "vmprofiles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["vmrogue.io"]
    resources:
      - "vmroguevms/status"
      - "vmrogueblueprints/status"
      - "vmroguepolicies/status"
      - "vmrogueinsights/status"
      - "vmrogueactions/status"
      - "vmtemplates/status"
      - "vmprofiles/status"
    verbs: ["get", "update", "patch"]
  # Core Kubernetes
  - apiGroups: [""]
    resources:
      - "namespaces"
      - "nodes"
      - "pods"
      - "pods/log"
      - "events"
      - "persistentvolumeclaims"
      - "configmaps"
      - "resourcequotas"
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach", "pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "configmaps"]
    verbs: ["create", "update", "patch", "delete"]
  # Leader election (snapshot scheduler Lease)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Storage (classes, CSI capacity, CSI volume snapshots)
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csistoragecapacities", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CDI (DataVolume / import / upload — full verbs for GitOps-style API use)
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["upload.cdi.kubevirt.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # KubeVirt instance types / preferences (VM specs may reference these)
  - apiGroups: ["instancetype.kubevirt.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Multus / NADs
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Gateway API (optional ingress next-gen)
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Chaos Mesh / Litmus (custom-resources + chaos handlers list arbitrary CRs in these groups)
  - apiGroups: ["chaos-mesh.org", "litmuschaos.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Cilium (optional — read + manage policies from API)
  - apiGroups: ["cilium.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # RBAC (read-only visualization)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  # Apps (workloads / operator discovery)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  # Autoscaling
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CRD discovery
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # KubeVirt cluster MigrationPolicy CRs (API: /api/v1/kubevirt/migration-policies)
  - apiGroups: ["migrations.kubevirt.io"]
    resources: ["migrationpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Metrics Server (VM live metrics via PodMetrics)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmrogue
subjects:
  - kind: ServiceAccount
    name: vmrogue
    namespace: vmrogue-system
roleRef:
  kind: ClusterRole
  name: vmrogue
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmrogue-api
  namespace: vmrogue-system
  labels:
    app.kubernetes.io/name: vmrogue
    app.kubernetes.io/component: api
spec:
  replicas: 1
  # Avoid two pods during rollout: hostPort binds would collide on a single node.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmrogue
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmrogue
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: vmrogue
      initContainers:
        - name: gen-cert
          image: alpine/openssl:3.3.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              openssl req -x509 -nodes -days 3650 \
                -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
                -keyout /certs/tls.key -out /certs/tls.crt \
                -subj "/CN=vmrogue/O=vmrogue" \
                -addext "subjectAltName=DNS:vmrogue-api,DNS:vmrogue-api.vmrogue-system.svc,DNS:localhost,IP:127.0.0.1"
              chown 10001:10001 /certs/tls.key /certs/tls.crt
              chmod 600 /certs/tls.key && chmod 644 /certs/tls.crt
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
      containers:
        - name: vmrogue
          image: docker.io/library/vmrogue:latest
          imagePullPolicy: Never
          args: ["api-serve", "--port", "5151", "--host", "0.0.0.0", "--tls", "--tls-cert", "/certs/tls.crt", "--tls-key", "/certs/tls.key"]
          ports:
            - containerPort: 5151
              hostPort: 5151
              name: https
              protocol: TCP
            - containerPort: 5150
              hostPort: 5150
              name: http-redirect
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          env:
            - name: VMROGUE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vmrogue-api-key
                  key: api-key
            - name: RUST_LOG
              value: "info"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: tls-certs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vmrogue-api
  namespace: vmrogue-system
  labels:
    app.kubernetes.io/name: vmrogue
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: vmrogue
    app.kubernetes.io/component: api
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
      nodePort: 30151
    - port: 80
      targetPort: http-redirect
      protocol: TCP
      name: http-redirect
      nodePort: 30150
