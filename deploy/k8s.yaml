# VMRogue Kubernetes Deployment
#
# Prerequisites:
#   kubectl create secret generic vmrogue-api-key \
#     --namespace=vmrogue-system \
#     --from-literal=api-key=$(openssl rand -hex 32)
#
# Or use: ./scripts/deploy-k8s.sh deploy (creates the secret automatically)
---
apiVersion: v1
kind: Namespace
metadata:
  name: vmrogue-system
  labels:
    app.kubernetes.io/name: vmrogue
    app.kubernetes.io/part-of: vmrogue
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmrogue
  namespace: vmrogue-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmrogue
rules:
  # KubeVirt VMs
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances", "virtualmachineinstancemigrations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # KubeVirt VNC/console subresources (needed for virtctl vnc)
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/vnc", "virtualmachineinstances/console"]
    verbs: ["get"]
  # KubeVirt snapshots
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots", "virtualmachinesnapshotcontents", "virtualmachinerestores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Core resources
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete"]
  # Storage classes
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmrogue
subjects:
  - kind: ServiceAccount
    name: vmrogue
    namespace: vmrogue-system
roleRef:
  kind: ClusterRole
  name: vmrogue
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmrogue-api
  namespace: vmrogue-system
  labels:
    app.kubernetes.io/name: vmrogue
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmrogue
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmrogue
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: vmrogue
      containers:
        - name: vmrogue
          image: ghcr.io/ssahani/vmrogue:latest
          args: ["api-serve", "--port", "5151", "--host", "0.0.0.0"]
          ports:
            - containerPort: 5151
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          env:
            - name: VMROGUE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vmrogue-api-key
                  key: api-key
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vmrogue-api
  namespace: vmrogue-system
  labels:
    app.kubernetes.io/name: vmrogue
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: vmrogue
    app.kubernetes.io/component: api
  ports:
    - port: 5151
      targetPort: http
      protocol: TCP
      name: http
      nodePort: 30151
