# Prerequisites: Create the API key secret:
#   kubectl create secret generic vmrogue-api-key \
#     --namespace=vmrogue \
#     --from-literal=api-key=$(openssl rand -hex 32)
---
apiVersion: v1
kind: Namespace
metadata:
  name: vmrogue
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmrogue-web
  namespace: vmrogue
  labels:
    app: vmrogue-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmrogue-web
  template:
    metadata:
      labels:
        app: vmrogue-web
    spec:
      serviceAccountName: vmrogue-web
      containers:
        - name: vmrogue-web
          image: vmrogue:local
          command: ["/usr/local/bin/vmrogue"]
          args: ["api-serve", "--port", "5151", "--host", "0.0.0.0"]
          ports:
            - containerPort: 5151
              name: http
          env:
            - name: VMROGUE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vmrogue-api-key
                  key: api-key
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5151
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5151
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmrogue-web
  namespace: vmrogue
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmrogue-web
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots", "virtualmachinerestores"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmrogue-web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vmrogue-web
subjects:
  - kind: ServiceAccount
    name: vmrogue-web
    namespace: vmrogue
---
apiVersion: v1
kind: Service
metadata:
  name: vmrogue-web
  namespace: vmrogue
spec:
  type: NodePort
  selector:
    app: vmrogue-web
  ports:
    - port: 5151
      targetPort: 5151
      nodePort: 30080
      name: http
