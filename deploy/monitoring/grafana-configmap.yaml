---
# ConfigMap to auto-provision the Grafana dashboard.
# Requires Grafana sidecar (grafana.sidecar.dashboards.enabled=true).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmrogue-grafana-dashboard
  namespace: vmrogue-system
  labels:
    app.kubernetes.io/name: vmrogue
    grafana_dashboard: "1"
data:
  vmrogue-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "panels": [
        {
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "title": "Total VMs",
          "type": "stat",
          "targets": [{ "expr": "count(kubevirt_vmi_info) or vector(0)" }]
        },
        {
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "title": "Running VMs",
          "type": "stat",
          "targets": [{ "expr": "count(kubevirt_vmi_phase_count{phase=\"Running\"}) or vector(0)" }]
        },
        {
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "title": "VM CPU Usage",
          "type": "timeseries",
          "targets": [{ "expr": "rate(kubevirt_vmi_cpu_usage_seconds_total[5m])", "legendFormat": "{{ name }}" }]
        },
        {
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "title": "VM Memory Usage",
          "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [{ "expr": "kubevirt_vmi_memory_resident_bytes", "legendFormat": "{{ name }}" }]
        }
      ],
      "tags": ["vmrogue", "kubevirt"],
      "title": "VMRogue Overview",
      "uid": "vmrogue-overview"
    }
