---
# ServiceMonitor for Veyron API server (use when Prometheus Operator already exists).
# For a full stack, prefer: ./scripts/install-veyron-monitoring.sh (charts/veyron-monitoring).
# Requires Prometheus Operator (prometheus-operator.dev)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: veyron-api
  namespace: veyron-system
  labels:
    app.kubernetes.io/name: veyron
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: veyron
  namespaceSelector:
    matchNames:
      - veyron-system
  endpoints:
    - port: https
      path: /api/v1/health
      interval: 30s
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
---
# ServiceMonitor for Veyron Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: veyron-operator
  namespace: veyron-system
  labels:
    app.kubernetes.io/name: veyron-operator
    app.kubernetes.io/component: operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: veyron-operator
  namespaceSelector:
    matchNames:
      - veyron-system
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
