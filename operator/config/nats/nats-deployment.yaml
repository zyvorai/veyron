apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: veyron-system
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: event-bus
    app.kubernetes.io/part-of: veyron
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: event-bus
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args:
            - "--jetstream"
            - "--store_dir=/data"
            - "-m"
            - "8222"
          ports:
            - containerPort: 4222
              name: client
              protocol: TCP
            - containerPort: 8222
              name: monitoring
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8222
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: veyron-system
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: event-bus
    app.kubernetes.io/part-of: veyron
spec:
  type: ClusterIP
  ports:
    - port: 4222
      targetPort: 4222
      name: client
      protocol: TCP
    - port: 8222
      targetPort: 8222
      name: monitoring
      protocol: TCP
  selector:
    app.kubernetes.io/name: nats
