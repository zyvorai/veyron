apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vmrogueinsights.vmrogue.io
spec:
  group: vmrogue.io
  names:
    kind: VMRogueInsight
    listKind: VMRogueInsightList
    plural: vmrogueinsights
    singular: vmrogueinsight
    shortNames:
      - vrin
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.insightType
        - name: Severity
          type: string
          jsonPath: .spec.severity
        - name: VM
          type: string
          jsonPath: .spec.vmRef
        - name: State
          type: string
          jsonPath: .status.state
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: ["insightType", "severity", "title", "description"]
              properties:
                insightType:
                  type: string
                  enum: ["Performance", "Security", "Cost", "Anomaly", "Capacity", "Network", "Drift"]
                severity:
                  type: string
                  enum: ["Critical", "High", "Medium", "Low", "Info"]
                vmRef:
                  type: string
                namespace:
                  type: string
                title:
                  type: string
                description:
                  type: string
                source:
                  type: string
                data:
                  type: object
                  additionalProperties:
                    type: string
                metrics:
                  type: array
                  items:
                    type: object
                    required: ["name", "value"]
                    properties:
                      name:
                        type: string
                      value:
                        type: number
                        format: double
                      unit:
                        type: string
                      timestamp:
                        type: string
                        format: date-time
            status:
              type: object
              properties:
                state:
                  type: string
                  enum: ["New", "Acknowledged", "Resolved", "Dismissed"]
                actionRef:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: ["type", "status", "lastTransitionTime", "reason", "message"]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
