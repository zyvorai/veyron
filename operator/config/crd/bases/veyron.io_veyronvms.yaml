apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: veyronvms.veyron.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: veyron.io
  names:
    kind: VeyronVM
    listKind: VeyronVMList
    plural: veyronvms
    singular: veyronvm
    shortNames:
      - vrvm
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: VM
          type: string
          jsonPath: .status.kubevirtVMName
        - name: Node
          type: string
          jsonPath: .status.nodeName
        - name: IP
          type: string
          jsonPath: .status.ipAddress
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: ["cpu", "memory"]
              properties:
                template:
                  type: string
                profile:
                  type: string
                cpu:
                  type: object
                  required: ["cores"]
                  properties:
                    cores:
                      type: integer
                      format: int32
                      minimum: 1
                    sockets:
                      type: integer
                      format: int32
                      default: 1
                    threads:
                      type: integer
                      format: int32
                      default: 1
                    model:
                      type: string
                    dedicatedCpuPlacement:
                      type: boolean
                    isolateEmulatorThread:
                      type: boolean
                memory:
                  type: object
                  required: ["size"]
                  properties:
                    size:
                      type: string
                    hugepagesPageSize:
                      type: string
                    maxGuest:
                      type: string
                disks:
                  type: array
                  items:
                    type: object
                    required: ["name", "size", "source"]
                    properties:
                      name:
                        type: string
                      size:
                        type: string
                      storageClass:
                        type: string
                      bootOrder:
                        type: integer
                        format: int32
                      source:
                        type: object
                        required: ["type"]
                        properties:
                          type:
                            type: string
                            # dataSource clones a per-VM disk from a golden image at
                            # create time; pvc/dataVolume only reference an existing
                            # volume, which two VMs must never share.
                            enum: ["blank", "pvc", "containerDisk", "dataVolume", "dataSource"]
                          name:
                            type: string
                          image:
                            type: string
                          namespace:
                            type: string
                          fromPvc:
                            type: boolean
                      deviceType:
                        type: string
                        enum: ["disk", "cdrom", "lun"]
                        default: disk
                      bus:
                        type: string
                      cache:
                        type: string
                      io:
                        type: string
                interfaces:
                  type: array
                  items:
                    type: object
                    required: ["name", "network", "networkType"]
                    properties:
                      name:
                        type: string
                      network:
                        type: string
                      model:
                        type: string
                        default: virtio
                      networkType:
                        type: object
                        required: ["type"]
                        properties:
                          type:
                            type: string
                            enum: ["pod", "bridge", "multus", "sriov"]
                          name:
                            type: string
                      macAddress:
                        type: string
                cloudInit:
                  type: object
                  properties:
                    userData:
                      type: string
                    userDataSecretRef:
                      type: object
                      required: ["name", "key"]
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                        namespace:
                          type: string
                    networkData:
                      type: string
                    delivery:
                      type: string
                      description: |
                        Empty or 'nocloud' for cloud-init NoCloud volume; 'configdrive' for cloudInitConfigDrive / Cloudbase-Init.
                features:
                  type: object
                  properties:
                    acpi:
                      type: boolean
                      default: true
                    apic:
                      type: boolean
                    hyperv:
                      type: object
                      properties:
                        relaxed:
                          type: boolean
                        vapic:
                          type: boolean
                        spinlocks:
                          type: integer
                          format: int32
                        vpindex:
                          type: boolean
                        runtime:
                          type: boolean
                        synic:
                          type: boolean
                        stimer:
                          type: boolean
                        reset:
                          type: boolean
                        frequencies:
                          type: boolean
                        reenlightenment:
                          type: boolean
                        tlbflush:
                          type: boolean
                        ipi:
                          type: boolean
                    kvmHidden:
                      type: boolean
                    smm:
                      type: boolean
                firmware:
                  type: object
                  required: ["bootloader"]
                  properties:
                    bootloader:
                      type: string
                      enum: ["bios", "efi"]
                    secureBoot:
                      type: boolean
                    persistent:
                      type: boolean
                clock:
                  type: object
                  properties:
                    utc:
                      type: boolean
                      default: true
                    timezone:
                      type: string
                    timers:
                      type: object
                      properties:
                        hpetPresent:
                          type: boolean
                        pitTickPolicy:
                          type: string
                        rtcTickPolicy:
                          type: string
                        hypervPresent:
                          type: boolean
                evictionStrategy:
                  type: string
                terminationGracePeriod:
                  type: integer
                  format: int64
                enableTpm:
                  type: boolean
                enableRng:
                  type: boolean
                machineType:
                  type: string
                running:
                  type: boolean
                labels:
                  type: object
                  additionalProperties:
                    type: string
                annotations:
                  type: object
                  additionalProperties:
                    type: string
                allowInternet:
                  type: boolean
                  default: true
                  description: Apply internet egress policy for this VM's virt-launcher pods.
                windows:
                  type: object
                  description: Windows-specific bootstrap secret references.
                  properties:
                    sysprepSecretRef:
                      type: object
                      required: ["name", "key"]
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                        namespace:
                          type: string
                    domainJoinSecretRef:
                      type: object
                      required: ["name", "key"]
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                        namespace:
                          type: string
                gpus:
                  type: array
                  description: |
                    GPUs bound via KubeVirt domain.devices.gpus (whole-GPU passthrough
                    or vGPU mediated devices). A VM holding a passthrough GPU can
                    never live-migrate.
                  items:
                    type: object
                    required: ["name", "deviceName"]
                    properties:
                      name:
                        type: string
                      deviceName:
                        type: string
                      virtualGPUOptions:
                        type: object
                        properties:
                          display:
                            type: boolean
                          ramFB:
                            type: boolean
                hostDevices:
                  type: array
                  description: Generic passthrough host devices (domain.devices.hostDevices).
                  items:
                    type: object
                    required: ["name", "deviceName"]
                    properties:
                      name:
                        type: string
                      deviceName:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Creating", "Running", "Stopped", "Failed", "Deleting", "Unknown"]
                kubevirtVMName:
                  type: string
                nodeName:
                  type: string
                ipAddress:
                  type: string
                guestOS:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: ["type", "status", "lastTransitionTime", "reason", "message"]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                lastReconciled:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
