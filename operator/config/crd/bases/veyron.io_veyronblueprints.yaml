apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: veyronblueprints.veyron.io
spec:
  group: veyron.io
  names:
    kind: VeyronBlueprint
    listKind: VeyronBlueprintList
    plural: veyronblueprints
    singular: veyronblueprint
    shortNames:
      - vrbp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: VMs
          type: integer
          jsonPath: .status.totalVMs
        - name: Ready
          type: integer
          jsonPath: .status.readyVMs
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: ["vms"]
              properties:
                description:
                  type: string
                vms:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: ["name", "template"]
                    properties:
                      name:
                        type: string
                      template:
                        type: string
                      profile:
                        type: string
                      cpu:
                        type: integer
                        format: int32
                      memory:
                        type: string
                      diskSize:
                        type: string
                      dependsOn:
                        type: array
                        items:
                          type: string
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                      override:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                tags:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Deploying", "Ready", "Failed", "Deleting"]
                deploymentOrder:
                  type: array
                  items:
                    type: string
                vmStatuses:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      phase:
                        type: string
                      vmRef:
                        type: string
                      message:
                        type: string
                totalVMs:
                  type: integer
                readyVMs:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required: ["type", "status", "lastTransitionTime", "reason", "message"]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
