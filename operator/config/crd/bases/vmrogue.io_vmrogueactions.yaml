apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vmrogueactions.vmrogue.io
spec:
  group: vmrogue.io
  names:
    kind: VMRogueAction
    listKind: VMRogueActionList
    plural: vmrogueactions
    singular: vmrogueaction
    shortNames:
      - vract
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Action
          type: string
          jsonPath: .spec.actionType
        - name: VM
          type: string
          jsonPath: .spec.vmRef
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Approved
          type: boolean
          jsonPath: .spec.approved
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: ["actionType", "approved"]
              properties:
                actionType:
                  type: string
                  enum:
                    - StartVM
                    - StopVM
                    - RestartVM
                    - ScaleResources
                    - CreateSnapshot
                    - DeleteSnapshot
                    - CreateBackup
                    - DeleteVM
                    - Migrate
                    - SendNotification
                    - RunScript
                    - Webhook
                vmRef:
                  type: string
                namespace:
                  type: string
                insightRef:
                  type: string
                description:
                  type: string
                approved:
                  type: boolean
                autoApprove:
                  type: boolean
                parameters:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Approved", "Executing", "Completed", "Failed", "Rejected"]
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: ["type", "status", "lastTransitionTime", "reason", "message"]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
