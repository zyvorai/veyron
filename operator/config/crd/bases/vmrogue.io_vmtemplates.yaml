apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vmtemplates.vmrogue.io
spec:
  group: vmrogue.io
  names:
    kind: VMTemplate
    listKind: VMTemplateList
    plural: vmtemplates
    singular: vmtemplate
    shortNames:
      - vmtpl
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Family
          type: string
          jsonPath: .spec.family
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: ["default"]
              properties:
                description:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                family:
                  type: string
                  enum: ["windows", "linux", "other"]
                recommendedProfiles:
                  type: array
                  items:
                    type: string
                minKubeVirtVersion:
                  type: string
                default:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
