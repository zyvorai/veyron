apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vmprofiles.veyron.io
spec:
  group: veyron.io
  names:
    kind: VMProfile
    listKind: VMProfileList
    plural: vmprofiles
    singular: vmprofile
    shortNames:
      - vmprof
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: CPU
          type: integer
          jsonPath: .spec.cores
        - name: Memory
          type: string
          jsonPath: .spec.memory
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: ["cores", "memory", "diskSize"]
              properties:
                description:
                  type: string
                cores:
                  type: integer
                  format: int32
                sockets:
                  type: integer
                  format: int32
                threads:
                  type: integer
                  format: int32
                memory:
                  type: string
                diskSize:
                  type: string
                gpus:
                  type: array
                  description: |
                    GPUs granted by this profile (KubeVirt domain.devices.gpus).
                    A VM holding a passthrough GPU can never live-migrate.
                  items:
                    type: object
                    required: ["name", "deviceName"]
                    properties:
                      name:
                        type: string
                      deviceName:
                        type: string
                      virtualGPUOptions:
                        type: object
                        properties:
                          display:
                            type: boolean
                          ramFB:
                            type: boolean
                useCases:
                  type: array
                  items:
                    type: string
                recommendedTemplates:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
