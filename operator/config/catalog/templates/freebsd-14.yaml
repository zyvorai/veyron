apiVersion: veyron.io/v1alpha1
kind: VMTemplate
metadata:
  labels:
    veyron.io/managed-by: veyron-catalog-export
  name: freebsd-14
spec:
  description: 'Veyron built-in template: freebsd-14'
  tags:
  - linux
  family: linux
  recommendedProfiles:
  - dev
  default:
    cpu:
      cores: 2
      sockets: 1
      threads: 1
    memory:
      size: '2Gi'
    disks:
    - name: rootdisk
      size: '20Gi'
      bootOrder: 1
      source:
        type: blank
      deviceType: disk
    interfaces:
    - name: default
      network: default
      model: virtio
      networkType:
        type: pod
    clock:
      utc: true
      timers:
        hpetPresent: false
        pitTickPolicy: delay
        rtcTickPolicy: catchup
    enableTpm: false
    enableRng: true
    labels:
      os.version: '14'
      os: freebsd
    allowInternet: true
