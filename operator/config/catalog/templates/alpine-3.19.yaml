apiVersion: vmrogue.io/v1alpha1
kind: VMTemplate
metadata:
  labels:
    vmrogue.io/managed-by: vmrogue-catalog-export
  name: alpine-3.19
spec:
  description: 'VMRogue built-in template: alpine-3.19'
  tags:
  - linux
  family: linux
  recommendedProfiles:
  - minimal
  default:
    cpu:
      cores: 1
      sockets: 1
      threads: 1
    memory:
      size: '512Mi'
    disks:
    - name: rootdisk
      size: '0'
      bootOrder: 1
      source:
        type: containerDisk
        image: quay.io/containerdisks/alpine:3.19
      deviceType: disk
    - name: datadisk
      size: '10Gi'
      bootOrder: 2
      source:
        type: blank
      deviceType: disk
    interfaces:
    - name: default
      network: default
      model: virtio
      networkType:
        type: pod
    cloudInit:
      userData: |
        #cloud-config
        user: alpine
        password: uXbe%aYCnLVtye5j
        lock_passwd: false
        chpasswd: { expire: True }
        ssh_pwauth: False
        packages:
          - qemu-guest-agent
        runcmd:
          - rc-update add qemu-guest-agent
          - rc-service qemu-guest-agent start
    clock:
      utc: true
      timers:
        hpetPresent: false
        pitTickPolicy: delay
        rtcTickPolicy: catchup
    enableTpm: false
    enableRng: true
    labels:
      os.version: '3.19'
      os: alpine
    allowInternet: true
