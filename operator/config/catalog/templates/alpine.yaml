apiVersion: vmrogue.io/v1alpha1
kind: VMTemplate
metadata:
  labels:
    vmrogue.io/managed-by: vmrogue-catalog-export
  name: alpine
spec:
  description: 'VMRogue built-in template: alpine'
  tags:
  - linux
  family: linux
  recommendedProfiles:
  - minimal
  default:
    cpu:
      cores: 1
      sockets: 1
      threads: 1
    memory:
      size: '512Mi'
    disks:
    - name: rootdisk
      size: '0'
      bootOrder: 1
      source:
        type: containerDisk
        image: quay.io/containerdisks/alpine:3.19
      deviceType: disk
    - name: datadisk
      size: '10Gi'
      bootOrder: 2
      source:
        type: blank
      deviceType: disk
    interfaces:
    - name: default
      network: default
      model: virtio
      networkType:
        type: pod
    cloudInit:
      userData: "#cloud-config\nuser: alpine\npassword: R!ShfVaf47ybjM8z\nlock_passwd: false\nchpasswd: { expire: True }\nssh_pwauth: False\npackages:\n  - curl\nwrite_files:\n  - path: /etc/systemd/system/guestkit-agent.service\n    content: |\n      [Unit]\n      Description=GuestKit Agent (Zyvor)\n      After=network.target\n      ConditionPathExists=/dev/virtio-ports/org.qemu.guest_agent.0\n      \n      [Service]\n      ExecStart=/usr/local/bin/guestkit agent --channel virtio\n      Restart=on-failure\n      User=root\n      StandardOutput=journal\n      StandardError=journal\n      \n      [Install]\n      WantedBy=multi-user.target\nruncmd:\n  - [ sh, -c, 'curl -fsSL -o /usr/local/bin/guestkit \"http://vmrogue.vmrogue-system.svc:5151/api/v1/platform/guestkit/binary\"' ]\n  - [ chmod, '0755', /usr/local/bin/guestkit ]\n  - [ rc-update, add, guestkit-agent, default ]\n  - [ rc-service, guestkit-agent, start ]\n"
    clock:
      utc: true
      timers:
        hpetPresent: false
        pitTickPolicy: delay
        rtcTickPolicy: catchup
    enableTpm: false
    enableRng: true
    labels:
      os: alpine
      os.version: '3.19'
    allowInternet: true
