apiVersion: veyron.io/v1alpha1
kind: VMTemplate
metadata:
  labels:
    veyron.io/managed-by: veyron-catalog-export
  name: almalinux-9
spec:
  description: 'Veyron built-in template: almalinux-9'
  tags:
  - linux
  family: linux
  recommendedProfiles:
  - database
  default:
    cpu:
      cores: 2
      sockets: 1
      threads: 1
    memory:
      size: '4Gi'
    disks:
    - name: rootdisk
      size: '0'
      bootOrder: 1
      source:
        type: containerDisk
        image: quay.io/containerdisks/almalinux:9
      deviceType: disk
    - name: datadisk
      size: '20Gi'
      bootOrder: 2
      source:
        type: blank
      deviceType: disk
    interfaces:
    - name: default
      network: default
      model: virtio
      networkType:
        type: pod
    cloudInit:
      userData: "#cloud-config\nuser: veyron\npassword: xKGYH%WugWNotz87\nlock_passwd: false\nchpasswd: { expire: True }\nssh_pwauth: False\npackage_update: true\npackages:\n  - curl\nmanage_resolv_conf: true\nresolv_conf:\n  nameservers: ['10.43.0.10']\n  searchdomains:\n    - veyron-system.svc.cluster.local\n    - svc.cluster.local\n    - cluster.local\n\nwrite_files:\n  - path: /usr/local/sbin/veyron-install-guestkit.sh\n    permissions: '0755'\n    content: |\n      #!/bin/sh\n      set -eu\n      URLS=\"\n      https://veyron-api.veyron-system.svc.cluster.local/api/v1/platform/guestkit/binary\n      https://github.com/zyvorai/guestkit/releases/download/guestkit-agent-v0.3.14/guestkitd\n      \"\n      mkdir -p /usr/local/bin\n      for attempt in $(seq 1 30); do\n        for url in $URLS; do\n          [ -z \"$url\" ] && continue\n          if curl -fkSL -o /usr/local/bin/guestkit \"$url\" 2>/dev/null && [ -s /usr/local/bin/guestkit ]; then\n            chmod 0755 /usr/local/bin/guestkit\n            exit 0\n          fi\n        done\n        sleep 10\n      done\n      echo \"GuestKit binary download failed after 30 attempts\" >&2\n      exit 1\n  - path: /etc/systemd/system/guestkit-agent.service\n    content: |\n      [Unit]\n      Description=GuestKit Agent (Zyvor)\n      After=network-online.target\n      Wants=network-online.target\n      \n      [Service]\n      ExecStart=/bin/sh -c 'until [ -e /dev/virtio-ports/org.qemu.guest_agent.0 ]; do sleep 2; done; exec /usr/local/bin/guestkit agent --channel virtio'\n      Restart=always\n      RestartSec=5\n      User=root\n      StandardOutput=journal\n      StandardError=journal\n      \n      [Install]\n      WantedBy=multi-user.target\nruncmd:\n  - /usr/local/sbin/veyron-install-guestkit.sh\n  - [ systemctl, daemon-reload ]\n  - [ systemctl, enable, guestkit-agent ]\n  - [ systemctl, start, guestkit-agent ]\n"
    clock:
      utc: true
      timers:
        hpetPresent: false
        pitTickPolicy: delay
        rtcTickPolicy: catchup
    enableTpm: false
    enableRng: true
    labels:
      os: almalinux
      os.version: '9'
    allowInternet: true
