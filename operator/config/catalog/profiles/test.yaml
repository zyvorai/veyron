apiVersion: veyron.io/v1alpha1
kind: VMProfile
metadata:
  labels:
    veyron.io/managed-by: veyron-catalog-export
  name: test
spec:
  description: Testing environment - moderate resources for CI/CD
  cores: 2
  sockets: 1
  threads: 1
  memory: '4Gi'
  diskSize: '20Gi'
  useCases:
  - CI/CD pipelines
  - Integration testing
  - QA environments
  recommendedTemplates:
  - ubuntu
  - almalinux
  - rocky
