apiVersion: veyron.io/v1alpha1
kind: VMProfile
metadata:
  labels:
    veyron.io/managed-by: veyron-catalog-export
  name: web
spec:
  description: Web server - optimized for HTTP workloads
  cores: 4
  sockets: 1
  threads: 1
  memory: '8Gi'
  diskSize: '40Gi'
  useCases:
  - Web applications
  - Nginx
  - Apache
  - Static sites
  - Reverse proxy
  recommendedTemplates:
  - ubuntu
  - debian
