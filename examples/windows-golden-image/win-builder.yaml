apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: win-builder
  namespace: vm-images
  labels:
    zyvor.dev/os: windows
    zyvor.dev/image-role: builder
spec:
  # A clean sysprep /shutdown must NOT be restarted — otherwise KubeVirt boots the
  # generalized image straight back into OOBE and undoes the seal.
  runStrategy: RerunOnFailure
  dataVolumeTemplates:
    - metadata:
        name: win-builder-root
      spec:
        preallocation: false
        source:
          blank: {}
        storage:
          storageClassName: zyvor-rbd-prod
          accessModes: ["ReadWriteOnce"]
          volumeMode: Block
          # If you change this, also bump disk_size in
          # test-windows-golden-image-remote.sh's tenant-clone request —
          # CDI's clone validator rejects a target smaller than its source.
          resources:
            requests:
              storage: 70Gi
  template:
    metadata:
      labels:
        kubevirt.io/vm: win-builder
    spec:
      terminationGracePeriodSeconds: 120
      domain:
        machine:
          type: q35
        cpu:
          sockets: 1
          cores: 4
          threads: 1
        memory:
          guest: 6Gi
        resources:
          requests:
            memory: 6Gi
        clock:
          utc: {}
          timer:
            hpet:
              present: false
            pit:
              tickPolicy: delay
            rtc:
              tickPolicy: catchup
            hyperv: {}
        features:
          acpi: {}
          apic: {}
          smm:
            enabled: true
          hyperv:
            relaxed: {}
            vapic: {}
            spinlocks:
              spinlocks: 8191
        firmware:
          bootloader:
            efi:
              secureBoot: true
        devices:
          tpm: {}
          rng: {}
          inputs:
            - name: tablet
              type: tablet
              bus: usb
          disks:
            - name: rootdisk
              bootOrder: 2
              disk:
                bus: virtio
            - name: installcd
              bootOrder: 1
              cdrom:
                bus: sata
            - name: virtio-drivers
              cdrom:
                bus: sata
            - name: sysprep
              cdrom:
                bus: sata
          interfaces:
            - name: default
              masquerade: {}
              model: virtio
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: win-builder-root
        - name: installcd
          dataVolume:
            name: win11-ltsc-iso
        - name: virtio-drivers
          containerDisk:
            image: quay.io/kubevirt/virtio-container-disk@sha256:6b823946eb7493347a93d6daa16b4101a68e16a0ee1766e01ac3adf82e4b5838
        - name: sysprep
          sysprep:
            secret:
              name: win-builder-sysprep
