# Windows domain join — ExternalSecrets-friendly layout
# Apply Secrets before VeyronVM / VeyronBlueprint that reference them.
---
apiVersion: v1
kind: Secret
metadata:
  name: win-sysprep
  namespace: default
type: Opaque
stringData:
  userdata: |
    #ps1_sysnative
    Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
    Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
---
apiVersion: v1
kind: Secret
metadata:
  name: ad-join
  namespace: default
type: Opaque
stringData:
  join.json: |
    {
      "domain": "corp.example.com",
      "ou": "OU=Servers,DC=corp,DC=example,DC=com",
      "username": "CORP\\joinsvc",
      "password": "REPLACE_ME"
    }
